exclude:
  - 20906  # Trueshot Aura: passive group aura, excluded by the spec
  - 409580  # Heart of the Lion: Season of Discovery spell; Forever's hunter page names it only as a client leftover

override:
  25289: {burst: false}  # Battle Shout: 3 min party buff kept up continuously, not a cooldown

# Buffs in one list share one exclusivity group (key = first name's current excl).
# Resistance-only buffs (Shadow Protection, Prayer of Shadow Protection) and Blessing of
# Salvation have no stat effect and are intentionally absent.
excl_merge:
  - ["Power Word: Fortitude", "Prayer of Fortitude"]
  - ["Arcane Intellect", "Arcane Brilliance"]
  - ["Mark of the Wild", "Gift of the Wild"]
  - ["Blessing of Kings", "Greater Blessing of Kings"]
  - ["Blessing of Might", "Greater Blessing of Might"]
  - ["Blessing of Wisdom", "Greater Blessing of Wisdom"]
  - ["Divine Spirit", "Prayer of Spirit"]
  - ["Ice Armor", "Frost Armor"]
  - ["Demon Armor", "Demon Skin"]
  - ["Aspect of the Hawk", "Aspect of the Beast"]
  - ["Warchief's Blessing", "Might of Stormwind"]
  - ["Spirit of Zanza", "Permanent Spirit of Zanza"]
  - ["Rumsey Rum Black Label", "Rumsey Rum", "Rumsey Rum Dark", "Rumsey Rum Light", "Gordok Green Grog"]
  - ["Sayge's Dark Fortune of Armor", "Sayge's Dark Fortune of Strength", "Sayge's Dark Fortune of Agility",
     "Sayge's Dark Fortune of Stamina", "Sayge's Dark Fortune of Intelligence", "Sayge's Dark Fortune of Spirit"]


# Buffs in one list share one exclusivity group, keyed "<cat>:<first name>". These explicit
# groups override the consumable stacking model (one flask, one weapon enchant, one Well Fed
# food, one elixir / scroll per dominant stat; tools/curated.py stacking_group).
# A one-name list keeps a consumable in a group of its own.
# Resistance-only buffs (Shadow Protection, Prayer of Shadow Protection) and Blessing of
# Salvation have no stat effect and are intentionally absent.
excl_merge:
  - ["Power Word: Fortitude", "Prayer of Fortitude"]
  - ["Arcane Intellect", "Arcane Brilliance"]
  - ["Mark of the Wild", "Gift of the Wild"]
  - ["Blessing of Kings", "Greater Blessing of Kings"]
  - ["Blessing of Might", "Greater Blessing of Might"]
  - ["Blessing of Wisdom", "Greater Blessing of Wisdom"]
  - ["Divine Spirit", "Prayer of Spirit"]
  - ["Ice Armor", "Frost Armor"]
  - ["Demon Armor", "Demon Skin"]
  - ["Aspect of the Hawk", "Aspect of the Beast"]
  - ["Warchief's Blessing", "Might of Stormwind"]
  - ["Spirit of Zanza", "Permanent Spirit of Zanza"]
  - ["Rat Familiar", "Frog Familiar", "Cat Familiar"]  # scroll familiars: one pet at a time
  # Rumsey Rum family (incl. Gordok Green Grog) stacks with Well Fed food in vanilla; no other food
  # exception is listed because none has documented evidence (Kreeg's stays in Well Fed).
  - ["Rumsey Rum Black Label", "Rumsey Rum", "Rumsey Rum Dark", "Rumsey Rum Light", "Gordok Green Grog"]
  - ["Sayge's Dark Fortune of Armor", "Sayge's Dark Fortune of Strength", "Sayge's Dark Fortune of Agility",
     "Sayge's Dark Fortune of Stamina", "Sayge's Dark Fortune of Intelligence", "Sayge's Dark Fortune of Spirit"]

# Conflict slots: merge stacking groups (current excl keys) across categories and name them.
# The build sets excl = id on every buff of the listed groups. Other groups get automatic names.
slots:
  - id: INT
    name: {en: Intellect, uk: Інтелект}
    groups: ["CLASS:Arcane Intellect", "SCROLL:INT"]  # incl. camp Boosted Intellect
  - id: STA
    name: {en: Stamina, uk: Витривалість}
    groups: ["CLASS:Power Word: Fortitude", "SCROLL:STA"]  # incl. camp Boosted Stamina
  - id: SPI
    name: {en: Spirit, uk: Дух}
    groups: ["CLASS:Divine Spirit", "SCROLL:SPI"]  # incl. camp Boosted Spirit
  - id: STR
    name: {en: Strength, uk: Сила}
    groups: ["SCROLL:STR", "CAMPING:Extra Strength"]
  - id: AP
    name: {en: Attack power, uk: Сила атаки}
    groups: ["CLASS:Blessing of Might"]  # incl. camp Boosted Attack Power
  - id: MP5
    name: {en: Mana regeneration, uk: Відновлення мани}
    groups: ["CLASS:Blessing of Wisdom"]  # incl. camp Boosted Mana Regeneration
  - id: STAT_PCT
    name: {en: All stats %, uk: Усі характеристики %}
    groups: ["CLASS:Blessing of Kings"]  # incl. camp Boosted Stats %
  - id: STATS
    name: {en: All stats, uk: Усі характеристики}
    groups: ["CLASS:Mark of the Wild"]  # incl. camp Boosted Stats
  - id: HUNTER_ASPECT
    name: {en: Hunter aspect, uk: Аспект мисливця}
    groups: ["CLASS:Aspect of the Hawk"]
  - id: SCROLL_FAMILIAR
    name: {en: Scroll familiar, uk: Фамільяр зі сувою}
    groups: ["SCROLL:Rat Familiar"]
  - id: DMF_FORTUNE
    name: {en: Darkmoon Faire fortune, uk: Удача ярмарку Темного Місяця}
    groups: ["WORLD:Sayge's Dark Fortune of Armor"]
  - id: CAPITAL_BLESSING
    name: {en: Capital city blessing, uk: Благословення столиці}
    groups: ["WORLD:Warchief's Blessing"]

